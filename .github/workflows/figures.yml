name: figures

# Builds every chart / word cloud / banner image and commits them to the repo.
# Run it by hand: Actions tab -> "figures" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate figures
        run: python scripts/generate_figures.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs assets/banner.png
          git diff --cached --quiet || git commit -m "Update generated figures"
          git push
